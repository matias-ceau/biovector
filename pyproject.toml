[project]
name = "biovector"
version = "0.1.0"
description = "Training data tracker"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "tabulate",
    "pyyaml",
]

[project.scripts]
biovector = "biovector.__main__:Main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biovector"]
