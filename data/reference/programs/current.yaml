# ─────────────────────────────────────────────────────────────────────
# Minimalist Strength Block — "Restart 2026"
# ─────────────────────────────────────────────────────────────────────
# Started: 2026-04-04 (Calibration)
# Frequency: 3×/week
# Duration: ~15 min per session
# Goal: strength >> hypertrophy, low rep (3–10), minimalist equipment
# Equipment: 10 kg bar, 3 pairs of 20 kg plates (130 kg cap), rack w/ safeties,
#            bench, pull-up bar, dip station
# BW: 103 kg (as of 2026-04-04)
#
# Old bests (2019–2022): DL 190, SQ 150, MP 70, FS ~100
# ─────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════
# WORKOUT STRUCTURE
# ═══════════════════════════════════════════════════════════════════

A:
  # Power clean goes first (degrades fastest under fatigue)
  exercises:
    - id: T20.1     # Power Clean
      role: power
      ladder: clean  # uses clean ladder (P0–P4)
    - id: S10       # Front Squat
      role: main
      ladder: main   # uses main ladder (S0–S5)
      plus_cap: 8
    - id: P01.00    # Bench Press
      role: main
      ladder: main
      plus_cap: 8
      notes: "A-day bench drives progression; B-day bench is support"

B:
  exercises:
    - id: S00       # Back Squat
      role: main
      ladder: main
      plus_cap: 8
    - id: P01.00    # Bench Press
      role: support  # volume follows A-day state
      ladder: bench_support
    - id: T00       # Chin Up (bodyweight)
      role: accessory
      ladder: bw_reps

C:
  exercises:
    - id: H00.0     # Deadlift
      role: main
      ladder: deadlift  # uses deadlift ladder (D0–D4)
      plus_cap: 6
    - id: P10.0     # Military Press
      role: main
      ladder: main
      plus_cap: 7
    - id: P20       # Dips (bodyweight)
      role: accessory
      ladder: bw_reps

# ═══════════════════════════════════════════════════════════════════
# MAIN LADDER — FS / SQ / BP / MP
# ═══════════════════════════════════════════════════════════════════
# Fixed-load / rep-state system. Load changes are infrequent.
# Rep-state changes do the work. Third set is always the + set.
#
# States:
#   S0 = 3, 3, 3+
#   S1 = 3, 3, 4+
#   S2 = 3, 4, 4+
#   S3 = 4, 4, 4+
#   S4 = 4, 4, 5+
#   S5 = 5, 5, 5+
#
# Rep caps:
#   FS / SQ / BP: cap + set at 8
#   MP: cap + set at 7
#
# Advancement (let t = target reps on + set for that state):
#   + set < t         → repeat state
#   + set = t or t+1  → advance 1 state
#   + set ≥ t+2       → advance 2 states
#   ugly/rejected set → treat as one bracket lower
#
# Load increase:
#   When S5 reached and + set gives:
#     FS / SQ / BP: 7+ clean reps → add load, reset to S0
#     MP: 6+ clean reps → add load, reset to S0
#
# Load jumps:
#   FS / BP / MP / PC: +10 kg total
#   SQ / DL: +20 kg total

main_ladder:
  states:
    S0: [3, 3, "3+"]
    S1: [3, 3, "4+"]
    S2: [3, 4, "4+"]
    S3: [4, 4, "4+"]
    S4: [4, 4, "5+"]
    S5: [5, 5, "5+"]
  plus_caps:
    default: 8
    MP: 7
  advancement:
    below_target: repeat
    at_target_or_plus_1: advance_1
    at_target_plus_2_or_more: advance_2
  load_increase_threshold:
    default: 7   # reps on + set at S5
    MP: 6
  load_jumps:
    FS: 10
    BP: 10
    MP: 10
    SQ: 20

# ═══════════════════════════════════════════════════════════════════
# DEADLIFT LADDER
# ═══════════════════════════════════════════════════════════════════
# Shorter ladder. No hero AMRAP deadlifts.
# Cap + set at 6. Max advance = 1 state per session.
#
# States:
#   D0 = 3, 3, 3+
#   D1 = 3, 3, 4+
#   D2 = 3, 4, 4+
#   D3 = 4, 4, 4+
#   D4 = 4, 4, 5+
#
# Advancement:
#   < target → repeat
#   = target or +1 → advance 1 state
#   ≥ target+2 → still only advance 1 state (capped)
#
# At D4, if + set = 6 clean → add +20 total, reset to D0

deadlift_ladder:
  states:
    D0: [3, 3, "3+"]
    D1: [3, 3, "4+"]
    D2: [3, 4, "4+"]
    D3: [4, 4, "4+"]
    D4: [4, 4, "5+"]
  plus_cap: 6
  max_advance_per_session: 1
  load_jump: 20

# ═══════════════════════════════════════════════════════════════════
# POWER CLEAN LADDER
# ═══════════════════════════════════════════════════════════════════
# No + sets. Technical quality is the only advancement criterion.
# Every rep must be fast, sharp, technically identical.
# If catches get messy or muscled → stay or reduce.
#
# States:
#   P0 = 5×1
#   P1 = 6×1
#   P2 = 4×2
#   P3 = 5×2
#   P4 = 6×2
#
# At P4, if still crisp → add +10 total, reset to P0

clean_ladder:
  states:
    P0: {sets: 5, reps: 1}
    P1: {sets: 6, reps: 1}
    P2: {sets: 4, reps: 2}
    P3: {sets: 5, reps: 2}
    P4: {sets: 6, reps: 2}
  advancement: "only if all reps fast and technically clean"
  load_jump: 10

# ═══════════════════════════════════════════════════════════════════
# BENCH SUPPORT (B-day bench)
# ═══════════════════════════════════════════════════════════════════
# B-day bench follows A-day bench state. Same load, no + set.
#
#   A bench at S0 or S1 → B bench = 3×3
#   A bench at S2 or S3 → B bench = 3×4
#   A bench at S4 or S5 → B bench = 3×5
#
# Special: during groove rebuild phase (load < programmed),
# B bench = prescribed paused reps (e.g. 5×3 paused)

bench_support:
  mapping:
    S0: [3, 3, 3]
    S1: [3, 3, 3]
    S2: [3, 4, 4]
    S3: [3, 4, 4]
    S4: [3, 5, 5]
    S5: [3, 5, 5]

# ═══════════════════════════════════════════════════════════════════
# BODYWEIGHT REP-GOAL PROGRESSION — Chins / Dips
# ═══════════════════════════════════════════════════════════════════
# Max 3 sets. Stop each set with ≥1 rep in reserve.
# When target total reached comfortably → raise target by +2 to +3.
#
# Starting targets:
#   Chins: 15 total reps
#   Dips: 12 total reps

bw_reps:
  max_sets: 3
  progression_increment: [2, 3]  # raise target by 2-3 when hit
  starting_targets:
    chins: 15
    dips: 12

