# Current 3-day A/B/C program
# Started 2026-04-04 (Calibration) → A1 (04-06) → B1 (04-08) → C1 → A2 → ...
# Cycle: A-B-C, numbered by week (A1,B1,C1 = week 1; A2,B2,C2 = week 2; ...)

name: "Restart 2026"
frequency: 3x/week
duration: ~15 min per session

# ─── Workout templates ───────────────────────────────────────────────

A:
  exercises:
    - id: T20.1    # Power Clean
      scheme: 5x1  # 5 singles
      notes: "Power work — explosive, full rest between singles"
    - id: S10      # Front Squat
      scheme: 3x3-5  # 3 sets of 3-5 reps
      notes: "Strength — last set push for reps if feeling good"
    - id: P01.00   # Bench Press
      scheme: 3x1-3  # 3 sets of 1-3 reps (heavy)
      notes: "Heavy singles/triples"

B:
  exercises:
    - id: S00      # Squat
      scheme: 3x3-5  # 3 sets of 3-5 reps, last set AMRAP
      notes: "Strength — last set push for reps"
    - id: P01.00   # Bench Press
      scheme: 3x3-10  # 3 sets, volume work (lighter than A)
      notes: "Volume — lighter weight, last set AMRAP"
    - id: T00      # Chin Up
      scheme: 3xAMRAP  # 3 sets to near-failure
      notes: "Bodyweight, target total from chins_target"

C:
  exercises:
    - id: P10.0    # Military Press
      scheme: 3x5  # 3 sets of 5 (or AMRAP on calibration)
      notes: "Strength work"
    - id: H00.0    # Deadlift
      scheme: 3x3-5  # 3 sets of 3-5 reps
      notes: "Currently in deload — use reduced load"
    - id: P20      # Dips
      scheme: 3xAMRAP  # 3 sets to near-failure
      notes: "Bodyweight, target total from dips_target"

# ─── State-based progression rules ──────────────────────────────────
#
# Each exercise in strength-states.json has a "state" and "load" (working weight).
# The state determines the rep/set scheme and progression logic.
#
# State machine:
#
#   S0 (base strength)
#     Prescription: 3×5 at load
#     Progress: If all 3×5 completed → S0p (add 2.5 kg next session)
#     Stall: If failed 3×5 twice at same load → D0
#
#   S0p (strength progressed)
#     Same as S0 but load was just increased
#     Progress: If 3×5 completed → stay S0p (keep adding 2.5 kg)
#     Stall: If failed → back to S0 at same load (retry once)
#     Double stall: → D0
#
#   S2 (strength phase 2)
#     Prescription: 3×3 at load, then 1×AMRAP at 70% of load
#     Used for exercises that have stalled on 3×5
#     Progress: If 3×3 completed and AMRAP ≥ 8 → add 2.5 kg
#     Stall: If failed 3×3 → D0
#
#   D0 (deload)
#     Prescription: 3×5 at load × 0.85 (round to nearest 2.5)
#     Duration: 1 session
#     After: → S0 at deload weight (reset load)
#
#   P0 (power base)
#     Prescription: 5×1 at load
#     Progress: If all 5 singles clean → P0p (add 2.5 kg)
#     Stall: If form breaks down → stay P0
#
#   P0p (power progressed)
#     Same as P0 but load was just increased
#     Progress: If 5×1 clean → keep P0p (add 2.5 kg)
#     Stall: → P0 at same load
#
# Bodyweight exercises (Chins, Dips):
#   Target is total reps across 3 sets
#   Progress: When target reached in ≤ 3 sets → increase target by 1-2
#   Example: chins_target=15 → sets of 7+5+3=15 → next time target=16
#
# ─── Load increments ────────────────────────────────────────────────
#
# Barbell exercises: +2.5 kg per progression
# Power Clean: +5 kg per progression (or +2.5 if near limit)
# Bodyweight: +1-2 reps on target
#
# ─── C1 prescription (from current states) ──────────────────────────
#
# MP: S0 at 60 kg → 3×5 @ 60 kg
#   (Calibration was 50×9, so 60 is a reasonable S0 starting point)
#
# DL: D0 at 130 kg → 3×5 @ 110 kg (130 × 0.85 ≈ 110, rounded to 2.5)
#   After this session: DL moves to S0 at 110 kg
#
# Dips: target 12 → 3 sets, aim for 12 total BW reps
#   (Calibration showed BW×5, so 3 sets of ~4 = 12 is reasonable)
